packages:
  - "apps/*"
  - "packages/*"
catalog:
  # dependencies
  '@element-plus/icons-vue': ^2.3.2
  '@vueuse/core': ^14.3.0
  dayjs: ^1.11.21
  element-plus: ^2.14.3
  lodash-unified: ^1.0.3
  markdown-it: ^14.3.0
  pinia: ^4.0.2
  vue: ^3.5.40
  vue-router: ^5.2.0
  # devDependencies
  '@types/markdown-it': ^14.1.2
  '@types/node': ^26.1.1
  '@vitejs/plugin-vue': ^6.0.8
  '@vue/tsconfig': ^0.9.1
  sass-embedded: ^1.100.0
  typescript: ^6.0.3
  unplugin-auto-import: ^21.0.0
  unplugin-vue-components: ^32.1.0
  vite: ^8.1.5
  vite-imagetools: ^10.0.1
  vue-tsc: ^3.3.8
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  better-sqlite3: true
  bufferutil: true
  cos-js-sdk-v5: true
  esbuild: true
  libpq: false # 有问题，暂不构建
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sqlite3: true
  unrs-resolver: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@floating-ui/core@1.8.0'
  - '@floating-ui/dom@1.8.0'
  - '@floating-ui/utils@0.2.12'
  - '@floating-ui/vue@2.0.1'
  - element-plus@2.14.3
